  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termosense IA LoT</title>
  
  <link rel="stylesheet" href="style.css">

<body>

  <header>
    <h1>Termosense IA IoT</h1>
    <p>Monitoreo en tiempo real y detección de incendios</p>
  </header>

  <div id="alerta-incendio" class="alerta oculta">
     ¡ALERTA DE INCENDIO! TEMPERATURA CRÍTICA DETECTADA
  </div>

  <main class="contenedor-principal">
    
    <section class="grid-tarjetas">
      <div class="tarjeta destaque">
        <h3>Actual</h3>
        <p id="temp-actual" class="valor">-- °C</p>
      </div>
      <div class="tarjeta">
        <h3>Mínima Hoy</h3>
        <p id="temp-min" class="valor-secundario">-- °C</p>
      </div>
      <div class="tarjeta">
        <h3>Máxima Hoy</h3>
        <p id="temp-max" class="valor-secundario">-- °C</p>
      </div>
    </section>

    <section class="tarjeta ia-card">
      <h3>Predicción del Clima (IA)</h3>
      <p id="prediccion">Analizando lecturas del sensor...</p>
    </section>

    <section class="tarjeta grafico-card">
      <h3>Histórico de Temperatura</h3>
      <div class="wrapper-grafico">
        <canvas id="graficoTemperatura"></canvas>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
