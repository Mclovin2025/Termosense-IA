<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperatura en tiempo real</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contenedor">
    <h1>Monitor de Temperatura</h1>
    <p class="subtitulo">Proyecto de termodinámica &mdash; datos en vivo</p>

    <section class="tarjeta principal">
      <p class="temp-valor"><span id="temp">--</span>&deg;C</p>
      <p class="estado" id="estado">Conectando con el sensor...</p>
    </section>

    <section class="detalle">
      <div class="tarjeta pequena">
        <h3>Sensor 1</h3>
        <p id="s1">--&deg;C</p>
      </div>
      <div class="tarjeta pequena">
        <h3>Sensor 2</h3>
        <p id="s2">--&deg;C</p>
      </div>
      <div class="tarjeta pequena">
        <h3>Sensor 3</h3>
        <p id="s3">--&deg;C</p>
      </div>
    </section>

    <section class="tarjeta qr">
      <h3>Comparte este sitio</h3>
      <img id="qr" alt="Código QR de este sitio">
    </section>
  </main>

  <!-- SDK de Firebase (sigue siendo JavaScript, solo se importa desde un CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="script.js?v=2"></script>. Ese '?v=2'
</body>
</html>
