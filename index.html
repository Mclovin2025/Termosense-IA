<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperatura en tiempo real</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contenedor">
    <p class="marca-uvg">UVG</p>
    <h1>TermoSense IA</h1>
    <p class="subtitulo">Monitoreo de Temperatura</p>

    <section class="tarjeta principal">
      <p class="temp-valor"><span id="temp">--</span>&deg;C</p>
      <p class="estado" id="estado">Conectando con el sensor...</p>
    </section>

    <section class="detalle">
      <div class="tarjeta pequena">
        <h3>Sensor 1</h3>
        <p id="s1">--&deg;C</p>
      </div>
      <div class="tarjeta pequena">
        <h3>Sensor 2</h3>
        <p id="s2">--&deg;C</p>
      </div>
      <div class="tarjeta pequena">
        <h3>Sensor 3</h3>
        <p id="s3">--&deg;C</p>
      </div>
    </section>

    <section class="tarjeta qr">
      <h3>Comparte este sitio</h3>
      <div id="qr"></div>
    </section>
  </main>

  <!-- SDK de Firebase (sigue siendo JavaScript, solo se importa desde un CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <!-- Librería para generar el QR directamente en el navegador (sin pedirle la imagen a otro servidor) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
